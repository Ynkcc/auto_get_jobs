name: Nuitka Build and Release

on:
  push:
    # branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建 Release（仅在手动运行时有效）'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签名称（如果创建 Release）'
        required: false
        default: 'manual-release'
        type: string

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include_browser: [true, false]
        # exclude:
        #   # 当 include_browser=false 时，排除 playwright 的安装
        #   - include_browser: false
        #     os: windows-latest  # 可根据需要排除特定系统
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        shell: bash
        run: |
          pip install -r requirements.txt
          if ${{ matrix.include_browser }}; then 
          playwright install chromium
          fi

      - name: Detect Chromium Version
        if: ${{ matrix.include_browser }}
        shell: bash
        run: |
          # 检测 Playwright 安装的 Chromium 版本
          echo "Detecting Chromium version..."
          
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            # Linux 系统 - 检查多个可能的路径
            PLAYWRIGHT_CACHE_DIRS=(
              "$HOME/.cache/ms-playwright"
              "$HOME/.cache/playwright"
            )
            
            CHROMIUM_VERSION=""
            for cache_dir in "${PLAYWRIGHT_CACHE_DIRS[@]}"; do
              if [[ -d "$cache_dir" ]]; then
                CHROMIUM_DIR=$(find "$cache_dir" -name "chromium-*" -type d | head -1)
                if [[ -n "$CHROMIUM_DIR" ]]; then
                  CHROMIUM_VERSION=$(basename "$CHROMIUM_DIR")
                  echo "Found Chromium in $cache_dir: $CHROMIUM_VERSION"
                  break
                fi
              fi
            done
          else
            # Windows 系统 - 检查多个可能的路径
            PLAYWRIGHT_CACHE_DIRS=(
              "$USERPROFILE/AppData/Local/ms-playwright"
              "$USERPROFILE/.cache/ms-playwright"
              "$LOCALAPPDATA/ms-playwright"
            )
            
            CHROMIUM_VERSION=""
            for cache_dir in "${PLAYWRIGHT_CACHE_DIRS[@]}"; do
              if [[ -d "$cache_dir" ]]; then
                CHROMIUM_DIR=$(find "$cache_dir" -name "chromium-*" -type d 2>/dev/null | head -1)
                if [[ -n "$CHROMIUM_DIR" ]]; then
                  CHROMIUM_VERSION=$(basename "$CHROMIUM_DIR")
                  echo "Found Chromium in $cache_dir: $CHROMIUM_VERSION"
                  break
                fi
              fi
            done
          fi
          
          # 如果没有找到特定版本，使用默认值
          if [[ -z "$CHROMIUM_VERSION" ]]; then
            echo "Chromium version not detected, using default 'chromium'"
            CHROMIUM_VERSION="chromium"
          fi
          
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
          echo "Will use Chromium version: $CHROMIUM_VERSION"

      - name: Build Executable with Nuitka
        uses: Ynkcc/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: src/main.py
          mode: onefile
          mingw64: true
          playwright-include-browser: ${{ matrix.include_browser && env.CHROMIUM_VERSION || 'none' }}

      - name: Prepare Resources
        shell: bash
        run: |
          set -x
          os_short=${{ matrix.os == 'ubuntu-latest' && 'ubuntu' || 'windows' }}
          dir_name="${os_short}${{ matrix.include_browser && '-chromium' || '' }}"
          mkdir -p "output/$dir_name"
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            mv build/main.bin "output/$dir_name/main"
          else
            mv build/main.exe "output/$dir_name/"
          fi
          mv data/resume_sample.png data/resume.png
          mv data/resume_for_ai_sample.md data/resume_for_ai.md 
          mv config/config_sample.yaml config/config.yaml
          cp -r config data "output/$dir_name/"
          
          echo "dir_name=${dir_name}" >> $GITHUB_OUTPUT
        id: package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.dir_name }}
          path: output/${{ steps.package.outputs.dir_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          find artifacts -mindepth 1 -maxdepth 1 -type d -exec zip -r {}.zip {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.release_tag }}
          name: Release ${{ github.ref_name != '' && github.ref_name || inputs.release_tag }}
          body: |
            ${{ github.event_name == 'workflow_dispatch' && 'Manual build' || 'Automated build' }} for version ${{ github.ref_name != '' && github.ref_name || inputs.release_tag }}
            - Includes Windows and Linux builds
            - Variants with/without Chromium browser
          files: artifacts/*
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
